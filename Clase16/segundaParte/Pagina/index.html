<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Lista de Alumnos</h1>
    <table border>
        <thead>
            <tr>
                <th>Legajo</th>
                <th>Nombre</th>
                <th>Edad</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>
    <script type="module">
        const tabla = document.getElementsByTagName("tbody")[0];
        
        fetch("http://localhost:3003/alumnos", {
            method: "GET"
        })
        .then((res) => res.json())
        .then(data => {
            for(const alumno of data){
                const fila = document.createElement("tr");
                fila.innerHTML =`<td>${alumno?.legajo}</td><td>${alumno?.nombre}</td><td>${alumno?.edad}</td>`;
                tabla.appendChild(fila);
            }
        })
