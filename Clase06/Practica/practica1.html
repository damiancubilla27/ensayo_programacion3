<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tareas</title>
    <link rel="stylesheet" href="practica1.css">
</head>
<body>

    <div class="contenedor">

        <h1 id="titulo">Lista de tareas</h1>

        <p id="mensaje">
            Todavía no hay tareas agregadas.
        </p>

        <div class="formulario">
            <input type="text" id="tareaInput" placeholder="Escribí una tarea">

            <button id="btnAgregar">
                Agregar tarea
            </button>
        </div>

        <h2>Tareas pendientes</h2>

        <ul id="listaTareas">
            <!-- Las tareas se agregarán mediante JavaScript -->
        </ul>

        <button id="btnMensaje">
            Mostrar mensaje
        </button>

    </div>

    <script src="practica1.js"></script>

</body>
</html>
